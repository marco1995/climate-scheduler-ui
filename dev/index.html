<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climate Scheduler – lokale Demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .demo-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: #163f43; color: white; }
    .demo-toolbar span { flex: 1; min-width: 200px; }
    .demo-toolbar button { padding: 8px 12px; border: 1px solid #a2c8c5; border-radius: 6px; background: #fff; color: #163f43; cursor: pointer; }
  </style>
</head>
<body>
  <nav class="demo-toolbar" aria-label="Demo-Steuerung">
    <span><strong>Lokale Demo</strong> · Simulierte Geräte · Änderungen bleiben in diesem Browser</span>
    <button id="theme">Hell / Dunkel</button>
    <button id="reset">Demo zurücksetzen</button>
  </nav>
  <script type="module">
    import { createDemoHass, STORAGE_KEY } from './mock-hass.mjs';
    await import('/climate_scheduler/static/panel.js?v=demo');
    const panel = document.createElement('climate-scheduler-panel');
    const hass = createDemoHass(localStorage);
    panel.hass = hass;
    document.body.append(panel);
    document.querySelector('#theme').onclick = () => {
      hass.themes.darkMode = !hass.themes.darkMode;
      panel.hass = hass;
    };
    document.querySelector('#reset').onclick = () => {
      if (confirm('Alle lokalen Demo-Änderungen zurücksetzen?')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    };
  </script>
</body>
</html>
